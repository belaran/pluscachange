name: CI

on:
  pull_request:
    branches:
      - main
#  push:
#    branches:
#      - main

jobs:
  build:
    name: Build Jekyll site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2.3'
          bundler-cache: true
      - run: bundle exec jekyll build --destination _site
        env:
          JEKYLL_ENV: production
      - uses: actions/upload-artifact@v4
        with:
          name: site-build
          path: _site

  preview:
    name: Deploy PR preview
    needs: build
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2.3'
          bundler-cache: true
      - run: bundle exec jekyll build --destination _site --baseurl "/<REPO_NAME>/pr-preview/pr-${{ github.event.number }}"
        env:
          JEKYLL_ENV: production
      - uses: rossjrw/pr-preview-action@v1
        with:
          source-dir: _site

  deploy:
    name: Deploy production to GitHub Pages
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2.3'
          bundler-cache: true
      - run: bundle exec jekyll build --destination _site
        env:
          JEKYLL_ENV: production
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - uses: actions/deploy-pages@v4
        id: deployment
